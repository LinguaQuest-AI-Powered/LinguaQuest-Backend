networks:
  iti:
    external: true

services:
  linguaquest-backend:
    container_name: linguaquest-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - iti
    ports:
      - "8088:8080"
    volumes:
      - ./logs:/app/logs
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /team8
      JAVA_OPTS: "-XX:+UseG1GC -Xms256m -Xmx512m -XX:+UseContainerSupport"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.team8-backend.rule=PathPrefix(`/team8`)"
      - "traefik.docker.network=iti"
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle-team8
    environment:
      DOZZLE_BASE: /team8-logs
      DOZZLE_BASE_PATH: /team8-logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - iti
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.team8-dozzle.rule=PathPrefix(`/team8-logs`)"
      - "traefik.http.services.team8-dozzle.loadbalancer.server.port=8080"
      - "traefik.docker.network=iti"
    restart: unless-stopped

