spring.config.import=optional:file:.env[.properties]

# Actuator & Logging Configuration
logging.file.name=logs/app.log
logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
management.endpoints.web.exposure.include=health,info,metrics,logfile
management.endpoint.health.show-details=always

spring.application.name=LinguaQuest
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/linguaquest_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Mailing Configuration (smtp or gmail-api)
mail.provider=${MAIL_PROVIDER:gmail-api}

# SMTP Configuration (used when mail.provider=smtp)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.default-encoding=UTF-8
management.health.mail.enabled=false

# Gmail REST API Configuration (used when mail.provider=gmail-api)
gmail.client-id=${GMAIL_CLIENT_ID}
gmail.client-secret=${GMAIL_CLIENT_SECRET}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN}
gmail.sender-email=${GMAIL_SENDER_EMAIL}

#Redis
spring.data.redis.host=${REDIS_URL:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
#spring.ai.google.genai.chat.model=gemini-3.5-flash

# OpenAI Configuration
spring.ai.openai.api-key= ${OPENCODE_API_KEY}
spring.ai.openai.base-url= https://opencode.ai/zen/v1
spring.ai.openai.chat.model=mimo-v2.5-free


# TripleAI Configuration
spring.ai.tripleai.base-url=http://apiaccess.iti.net.eg/api/v1
spring.ai.tripleai.api-key=${TRIPLEAI_API_KEY}
spring.ai.tripleai.default-model=openai.gpt-oss-20b-1:0
spring.ai.tripleai.multimodal-model=qwen.qwen3-vl-235b-a22b
# Set to true to enable TripleAI chat
spring.ai.tripleai.chat.enabled=false

